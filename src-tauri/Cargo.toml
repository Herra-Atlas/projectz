[package]
name = "projectz"
version = "0.3.3"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[features]
# Off by default. Turning it on links `ash` and, at runtime, requires the system
# Vulkan loader to be present -- a native dependency that can be missing, and an
# app that will not start without it is worse than one that cannot quote a VRAM
# figure. With it off the memory estimate still works; only the fit verdict is
# unavailable. See `ai/local/device.rs`.
vulkan-query = ["dep:ash"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "projectz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` is what `Window::add_child` lives behind, and the right panel's
# browser view is a child webview: a nested browsing surface inside the app's own
# window rather than a separate one. Tauri has no stable API for this, and the
# alternative -- a second `WebviewWindow` -- would be a real OS window with its
# own taskbar entry, which is not a panel.
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2"
# A second launch of the app is a request to see the window that is already open,
# not to start a rival one. Registered first in the builder (see `lib.rs`): it must
# run before `setup`, and on Windows before any other plugin, to hold the lock early.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
# Already in the tree as a transitive dependency of tauri; promoted to direct so
# the tool cache can stamp UTC ISO-8601 timestamps in the same format the
# frontend writes. Those timestamps are compared as strings, so the format is a
# correctness requirement and not just a display choice.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
pdf-extract = "0.12.1"
# `grep` searches by regular expression and `glob` matches paths by pattern, so
# both need a matcher. Already in the tree under `pdf-extract`; promoted to
# direct so the tools do not depend on a transitive crate that could drop them.
regex = "1"
glob = "0.3"
# Writing a PDF deliverable in `tools/documents/`. Already pulled in by
# `pdf-extract`; promoted for the same reason.
lopdf = "0.42"
rusqlite = { version = "0.40.2", features = ["bundled"] }
kestrel-rs = "11"
# The browser tools speak the Chrome DevTools Protocol, which is JSON over a
# WebSocket. This is the one crate the feature needs and it pulls in no TLS:
# the socket is to `127.0.0.1`, so there is nothing to encrypt and nothing
# extra to ship. See `browser/cdp.rs` for why the protocol half is hand-written
# even so -- it is a handful of messages, and the awkward parts are ours to own.
tokio-tungstenite = "0.24"
# Optional: only with the `vulkan-query` feature, which is off by default. See the
# feature note above.
ash = { version = "0.38", optional = true }

# Windows only. The driven browser is started as a child of this app and killed at
# exit through `taskkill`, but a crash or a force-quit never reaches that path -- so
# the browser is also placed in a job object whose limit kills it the moment this
# process' last handle to the job closes, i.e. when the app dies however it dies.
# Already in the tree as a transitive dependency of `tauri`; promoted to direct so
# the browser owns the one guarantee it needs. See `src/browser/job.rs`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Deliberately **not** `panic = "abort"`. Aborting turns one bug in one tool into a
# dead window mid-reply -- which is what a user reads as "the app restarted", and
# what costs a long run everything it had done. Unwinding lets the failure be
# caught where the tool runs (see `ai/remote/client.rs`) and turned into a failed
# call the model can route around, so the reply carries on. The bytes this costs
# are worth a window that stays up.
strip = true
