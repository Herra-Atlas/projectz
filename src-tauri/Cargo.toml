[package]
name = "projectz"
version = "0.6.6"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[features]
# Off by default. Turning it on links `ash` and, at runtime, requires the system
# Vulkan loader to be present -- a native dependency that can be missing, and an
# app that will not start without it is worse than one that cannot quote a VRAM
# figure. With it off the memory estimate still works; only the fit verdict is
# unavailable. See `ai/local/device.rs`.
vulkan-query = ["dep:ash"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "projectz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` is what `Window::add_child` lives behind, and the right panel's
# browser view is a child webview: a nested browsing surface inside the app's own
# window rather than a separate one. Tauri has no stable API for this, and the
# alternative -- a second `WebviewWindow` -- would be a real OS window with its
# own taskbar entry, which is not a panel.
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
# A second launch of the app is a request to see the window that is already open,
# not to start a rival one. Registered first in the builder (see `lib.rs`): it must
# run before `setup`, and on Windows before any other plugin, to hold the lock early.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `multipart` is the audio.cpp transcription upload: the microphone's WAV goes
# to `POST /v1/audio/transcriptions` like every OpenAI-shaped client's.
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dirs = "6"
# The microphone, and the only native audio dependency. WASAPI on Windows through
# a library that also covers the other two platforms, rather than a hand-written
# capture path per OS.
cpal = "0.15"
# Telegram voice messages arrive as Ogg Opus. Decoding in-process keeps voice
# transcription independent of ffmpeg being installed and avoids shelling out
# with the bot token's downloaded bytes.
opus-pure = "0.2.2"
# The Files panel's watcher. Recursive watching on the workspace root, so a
# file the user (or whatever else) changes outside the app still shows up in the
# tree while the panel is open. One small notification library rather than a
# polling thread: the OS tells us, and idle cost is one watch handle.
notify = "8.2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
# The speaker-embedding engine is a shared library loaded at runtime, because it
# is an optional install the user may never add: linking it would make every
# build require it. `bzip2` and `tar` unpack its release archive.
libloading = "0.8"
# ONNX Runtime for openWakeWord: loaded at runtime, so nothing is linked at
# build time and the DLL stays an installed engine rather than a build dep.
ort = { version = "2.0.0-rc.15", features = ["load-dynamic"] }
bzip2 = "0.4"
tar = "0.4"
# Already in the tree as a transitive dependency of tauri; promoted to direct so
# the tool cache can stamp UTC ISO-8601 timestamps in the same format the
# frontend writes. Those timestamps are compared as strings, so the format is a
# correctness requirement and not just a display choice.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
pdf-extract = "0.12.1"
# `grep` searches by regular expression and `glob` matches paths by pattern, so
# both need a matcher. Already in the tree under `pdf-extract`; promoted to
# direct so the tools do not depend on a transitive crate that could drop them.
regex = "1"
glob = "0.3"
# Writing a PDF deliverable in `tools/documents/`. Already pulled in by
# `pdf-extract`; promoted for the same reason.
lopdf = "0.42"
rusqlite = { version = "0.40.2", features = ["bundled"] }
kestrel-rs = "11"
# Optional: only with the `vulkan-query` feature, which is off by default. See the
# feature note above.
ash = { version = "0.38", optional = true }

[target.'cfg(windows)'.dependencies]
# The user's and machine's PATH live in the registry, and a child process only
# inherits the app's copy from launch time. Read at spawn time so a tool installed
# after the app started is usable without a restart; see `src/child/path.rs`.
winreg = "0.55"
# WebView2's own settings object. One switch on it --
# `AreBrowserAcceleratorKeysEnabled` -- is what stops the engine opening its
# built-in find bar on Ctrl+F, a browser shortcut no key handler in the page can
# prevent. See `src/webview_settings.rs` for the whole argument.
webview2-com = "0.39"
# `Interface::cast`, for reaching `ICoreWebView2Settings3` from the base settings
# interface that `CoreWebView2::Settings` hands back. The same version
# webview2-com is built against, so the two share one crate instance.
windows-core = "0.62"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Deliberately **not** `panic = "abort"`. Aborting turns one bug in one tool into a
# dead window mid-reply -- which is what a user reads as "the app restarted", and
# what costs a long run everything it had done. Unwinding lets the failure be
# caught where the tool runs (see `ai/remote/client.rs`) and turned into a failed
# call the model can route around, so the reply carries on. The bytes this costs
# are worth a window that stays up.
strip = true
